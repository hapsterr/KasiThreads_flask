<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../static/css/dashboard/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&family=Poetsen+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <section class="left">
        <h1>KasiThreads</h1>
        <a href="{{url_for('home')}}">Home</a>
        <a href="{{url_for('brands')}}">Brands</a>
        <a href="{{url_for('home_photos')}}">Home photos</a>
        <a href="{{url_for('products')}}">products</a>
        <a href="{{url_for('orders')}}">orders</a>
        <a href="{{url_for('settings')}}">settings</a>
    </section>

    <section class="right">
        <section class="top">
            <img src="../static/uploads/{{brandlogo[2]}}" alt="{{user}}", style="width: 130px;">
            <h2>{{user|capitalize}}</h2>
            <div class="header">
                <i class="fa fa-user user" aria-hidden="true"></i>
                <div class="logout">
                    <select name="logout" id="logout" onchange="handleLogout(event)">
                        <option value="" disabled selected></option>
                        <option value="logout">Logout</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="bottom">
            <h2>User, Welcome to KasiThreads Dashboard, you are loggedin as a Brand Owner</h2>
            <div class="orders">New orders will appear here</div>
        </section>
    </section>

    <script>
        function handleLogout(event) {
            if (event.target.value === "logout") {
                window.location.href = "{{ url_for('logout') }}";
            }
        }
    </script>
</body>
</html>
