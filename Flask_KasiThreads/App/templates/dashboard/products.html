<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="../../static/css/dashboard/global.css">
    <link rel="stylesheet" href="../../static/css/dashboard/products.css">
    <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body>
    <body>
        <section class="left">
            <h1>KasiThreads</h1>
            <a href="{{url_for('home')}}">Home</a>
            <a href="{{url_for('brands')}}">Brands</a>
            <a href="{{url_for('home_photos')}}">Home photos</a>
            <a href="{{url_for('products')}}">products</a>
            <a href="{{url_for('orders')}}">orders</a>
            <a href="{{url_for('settings')}}">settings</a>
        </section>
    
        <section class="right">
            <section class="top">
                
            </section>
    
            <section class="bottom">
                <h2>Upload and Delete Products</h2>
                <h3><a href="{{url_for('add_product')}}">+Add Product</a></h3>
        
                <div class="products">
                    {% for product in products %}
                    <div class="product">
                        <img src="../static/uploads/{{product[3]}}" alt="{{ product[1] }}" style="height: 25vh; width: 20%;">
                        <div class="info">
                            <h2>Name: {{ product[1] }}</h2>
                            <p>Description {{ product[2] }}</p>
                            <p>R{{ product[4] }}</p>
                            <p>Sizes: {{product[5]}}</p>
                            <p>Type: {{product[6]}}</p>
                            <button onclick="deleteProduct({{product[0]}})">Delete</button>
                        </div>
                        
                    </div>
                    {% endfor %}
                </div>

            </section>
        </section>

        <script src="../../static/javascript/dashboard/products.js"></script>
</body>
</html>
