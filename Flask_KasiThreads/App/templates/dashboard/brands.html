<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../static/css/dashboard/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body>
    <section class="left">
        <h1>KasiThreads</h1>
        <a href="{{url_for('home')}}">Home</a>
        <a href="{{url_for('brands')}}">Brands</a>
        <a href="{{url_for('home_photos')}}">Home photos</a>
        <a href="{{url_for('products')}}">products</a>
        <a href="{{url_for('orders')}}">orders</a>
        <a href="{{url_for('settings')}}">settings</a>
    </section>

    <section class="right">
        <section class="top">
            
        </section>

        <section class="bottom">
            <h2>User, Welcome to KasiThreads Dashboard, you are loggedin as a Brand Owner</h2>
            <form action="/register_user" method="post">
                <label for="brandname">Brandname:</label>
                <input type="text" id="brandname" name="brandname" required><br><br>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                
                <label for="user_type">User Type:</label>
                <select id="user_type" name="user_type" required>
                    <option value="admin">Admin</option>
                    <option value="brandowner">Brand Owner</option>
                </select><br><br>
                
                <button type="submit">Register</button>
            </form>
        </section>
    </section>
</body>
</html>
