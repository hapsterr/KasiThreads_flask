<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard/alert.css') }}">
</head>
<body>
    <div>
        <h1>KasiThreads</h1>
        <hr>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container mt-4">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
        <form action="/website_register" method="post">
            <input type="text" id="first_name" name="first_name" placeholder="First Name" required><br>
            <input type="text" id="last_name" name="last_name" placeholder="Last Name" required><br>
            <input type="email" id="email" name="email" placeholder="Email" required><br>
            <input type="text" id="phonenumber" name="phonenumber" placeholder="Phone Number" minlength="10" maxlength="10" required><br>
            <input type="password" id="password" name="password" placeholder="Password" required><br>
            <input type="password" id="password2" name="password2" placeholder="Repeat Password" required><br>
            <button type="submit">Register</button>
        </form>
        <div>Already have an account? <a href="{{url_for('account')}}">Login</a></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
